name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --check

      # `-D`, not `-W`. Warnings that never fail anything accumulate until
      # nobody reads them — this repo had 54 before they were cleared, which
      # is exactly enough noise to hide a real one. Lints that are genuinely
      # not worth following are declared as `#![allow]` with a reason at the
      # top of src/lib.rs, so a warning reaching CI now means something new.
      #
      # The trade: the toolchain is unpinned `stable`, and every Rust release
      # adds lints, so a bump can turn this red with no code change. That is
      # the intended failure — a new lint is worth an hour — but it means a red
      # clippy job on an untouched branch is a toolchain bump, not a
      # regression. Check `rustc --version` before hunting for a cause.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test
